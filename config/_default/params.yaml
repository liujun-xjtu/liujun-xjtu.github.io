# HUGO BLOX CONFIGURATION
hugoblox:
  schema: "2.0"

  identity:
    name: "刘均 | Jun Liu"
    organization: "西安交通大学"
    type: person
    tagline: "教授 / 计算机学院 / 西安交通大学"
    description: "刘均 — 西安交通大学计算机学院教授，博士生导师。研究方向：自然语言处理、计算机视觉、智慧教育。"
    social:
      twitter: ""

  theme:
    mode: light
    pack: "default"
    colors:
      primary: "blue"
      secondary: ""
      neutral: "slate"
    surfaces:
      background: ""
      foreground: ""
      header:
        background: ""
        foreground: ""
      footer:
        background: ""
        foreground: ""

  typography:
    pack: "academic"

  layout:
    radius: "md"
    spacing: "compact"
    avatar_shape: circle

  header:
    enable: true
    style: navbar
    sticky: true
    align: center
    search: false
    theme_toggle: true
    theme_picker: false
    language_switcher: false
    cta:
      enable: false
      text: ""
      url: ""

  footer:
    style: minimal
    language_switcher: true
    text: "© {year} 刘均 | 西安交通大学计算机学院"

  copyright:
    notice: ""
    license:
      type: cc
      allow_derivatives: false
      share_alike: true
      allow_commercial: false

  seo:
    title: ""
    location:
      address:
        street: ""
        city: ""
        region: ""
        postal_code: ""
        country: ""
      coordinates:
        latitude: null
        longitude: null
      phone: ""
    ai:
      allow: [/]
      disallow: []
      note: ""
      contact: ""

  content:
    math:
      enable: false
    toc:
      enable: true
    reading_time:
      enable: false
    citations:
      style: apa

  search:
    enable: false
    suggestions: []
    quick_actions: []

  comments:
    enable: false
    provider: ""

  analytics:
    google:
      measurement_id: ""
    google_tag_manager:
      container_id: ""
    plausible:
      domain: ""
    fathom:
      site_id: ""
    pirsch:
      site_id: ""
    clarity:
      project_id: ""
    baidu:
      site_id: ""

  verification:
    google: ""
    bing: ""
    baidu: ""

  locale:
    date_format: "2006-01-02"
    time_format: "3:04 PM"
    address_format: en-us

  security:
    csp:
      policy: ""
      report_only: false
    frame_options: allow
    permissions_policy: ""

  privacy:
    enable: false
    anonymize_analytics: true

  debug:
    enable: false
    hud:
      position: bottom-left
      opacity: 1.0
    export_logs: true

  pro:
    hide_attribution: false
    affiliate_code: ""
